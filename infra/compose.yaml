name: speak-studio
services:
  api:
    build:
      context: ../services/api
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_HOST: 0.0.0.0
      API_PORT: 3000
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:8000}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Generate internal service token}
      AUTH_MODE: ${AUTH_MODE:-token}
      CLIENT_ACCESS_TOKEN: ${CLIENT_ACCESS_TOKEN:-}
      METRICS_TOKEN: ${METRICS_TOKEN:?Generate monitoring token}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_JWKS_URL: ${JWT_JWKS_URL:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-125000}
      API_CONCURRENCY: ${API_CONCURRENCY:-2}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
    networks: [edge, inference]
    depends_on:
      ai: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    init: true
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  ai:
    build:
      context: ../services/ai
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim-bookworm}
        INSTALL_AI_RUNTIMES: ${INSTALL_AI_RUNTIMES:-0}
    environment:
      APP_ENV: ${APP_ENV:-development}
      AI_MODE: ${AI_MODE:-live}
      AI_HOST: 0.0.0.0
      AI_PORT: 8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Generate internal service token}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
      AI_MODEL_ROOT: /models
      WHISPER_MODEL_PATH: /models/whisper-small
      VOICE_CATALOG_PATH: /app/voices.json
      TTS_ENGINE: piper
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      AI_CPU_THREADS: ${AI_CPU_THREADS:-4}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-1}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_AUDIO_SECONDS: ${MAX_AUDIO_SECONDS:-60}
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: ${AI_CPU_THREADS:-4}
    volumes:
      - ai_models:/models:ro
    networks: [inference]
    depends_on:
      ollama: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp:size=256m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${AI_MEMORY_LIMIT:-4g}
    cpus: ${AI_CPU_LIMIT:-4}
    pids_limit: 256
    init: true
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  ollama:
    build:
      context: ./ollama
      args:
        OLLAMA_IMAGE: ${OLLAMA_IMAGE:-ollama/ollama:0.40.4}
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /root/.ollama/models
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
    volumes: [ollama_models:/root/.ollama]
    networks: [inference]
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-4g}
    cpus: ${OLLAMA_CPU_LIMIT:-4}
    pids_limit: 256
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
networks:
  edge: {}
  inference: {internal: true}
volumes:
  ai_models: {}
  ollama_models: {}
