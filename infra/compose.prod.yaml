services:
  api:
    environment:
      APP_ENV: production
      AUTH_MODE: jwt
    restart: unless-stopped
  ai:
    environment:
      APP_ENV: production
      AI_MODE: live
    restart: unless-stopped
  ollama:
    restart: unless-stopped
  proxy:
    image: ${CADDY_IMAGE:-caddy:2.10-alpine}
    ports: ['80:80', '443:443']
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set the production DNS name}
      ACME_EMAIL: ${ACME_EMAIL:?Set certificate contact email}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
volumes:
  caddy_data: {}
  caddy_config: {}
